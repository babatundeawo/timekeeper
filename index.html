<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timekeeper</title>
<meta name="description" content="A clock, countdown, stopwatch, Pomodoro timer, and alarms, in one quiet instrument.">
<meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<!-- Applied before paint so the correct theme renders on first frame, no flash. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('tk:theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<div class="app">

  <!-- ===== Header ===== -->
  <header class="header">
    <div class="wordmark">
      <span class="wordmark-mark" aria-hidden="true">◐</span>
      <span class="wordmark-text">Timekeeper</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="soundToggle" type="button" aria-label="Mute sound" aria-pressed="false">
        <svg class="icon icon-sound-on" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10H4Z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M18.8 6.2a8.5 8.5 0 0 1 0 11.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/></svg>
        <svg class="icon icon-sound-off" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10H4Z" fill="currentColor"/><path d="M16 9l4.5 6M20.5 9 16 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></g></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z" fill="currentColor"/></svg>
      </button>
      <button class="install-btn" id="installBtn" hidden type="button">Install app</button>
    </div>
  </header>

  <!-- ===== Mode switcher ===== -->
  <nav class="switcher" role="tablist" aria-label="Choose a mode">
    <span class="switcher-pill" id="switcherPill" aria-hidden="true"></span>
    <button class="switcher-item" role="tab" data-mode="clock" aria-selected="true">Clock</button>
    <button class="switcher-item" role="tab" data-mode="countdown" aria-selected="false">Countdown</button>
    <button class="switcher-item" role="tab" data-mode="stopwatch" aria-selected="false">Stopwatch</button>
    <button class="switcher-item" role="tab" data-mode="pomodoro" aria-selected="false">Focus</button>
    <button class="switcher-item" role="tab" data-mode="alarms" aria-selected="false">Alarms</button>
  </nav>

  <!-- ===== Stage: ring + digits, shared by clock/countdown/stopwatch/pomodoro ===== -->
  <main class="stage" id="stage">

    <div class="ring-wrap" id="ringWrap">
      <div class="ring-glow" aria-hidden="true"></div>
      <svg class="ring" viewBox="0 0 300 300" aria-hidden="true">
        <defs>
          <linearGradient id="ringGradBrass" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d9b878"/>
            <stop offset="100%" stop-color="#9d7a45"/>
          </linearGradient>
          <linearGradient id="ringGradNavy" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3a4f85"/>
            <stop offset="100%" stop-color="#161f38"/>
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="150" cy="150" r="138"></circle>
        <circle class="ring-progress" id="ringProgress" cx="150" cy="150" r="138"></circle>
        <!-- Parked at the 3 o'clock point (cx = cx-center + r) because the whole
             .ring svg carries a -90deg CSS rotation (the same trick ring-progress's
             stroke-dashoffset relies on to start at 12 instead of 3). Starting the
             tick here means JS's rotate(0deg) lands it at 12, not 9. -->
        <circle class="ring-tick" id="ringTick" cx="288" cy="150" r="3.5"></circle>
      </svg>

      <!-- Analog watch face: hour ticks + hour/minute/second hands. Only shown in Clock mode. -->
      <svg class="hands" id="handsSvg" viewBox="0 0 300 300" aria-hidden="true">
        <g id="hourTicks"></g>
        <line class="hand hand-hour" id="handHour" x1="150" y1="150" x2="150" y2="86"></line>
        <line class="hand hand-minute" id="handMinute" x1="150" y1="150" x2="150" y2="52"></line>
        <line class="hand hand-second" id="handSecond" x1="150" y1="160" x2="150" y2="40"></line>
        <circle class="hand-pivot" cx="150" cy="150" r="4.5"></circle>
      </svg>

      <div class="readout">
        <div class="digits" id="digits" aria-live="off">00:00:00</div>
        <div class="sub" id="subLabel">&nbsp;</div>
      </div>
    </div>

    <!-- Clock's own digital readout, given its own room below the dial so it
         never fights the hands for space (a hand can sweep through any point
         inside the circle; this can't). -->
    <div class="clock-meta" id="clockMeta" hidden>
      <div class="clock-meta-time" id="clockDigital">00:00:00</div>
      <div class="clock-meta-date" id="clockDate">&nbsp;</div>
    </div>

    <!-- Pomodoro session dots -->
    <div class="session-dots" id="sessionDots" hidden></div>

    <!-- Shared transport controls (countdown / stopwatch / pomodoro) -->
    <div class="transport" id="transport" hidden>
      <button class="btn btn-ghost" id="resetBtn" type="button">Reset</button>
      <button class="btn btn-primary" id="startBtn" type="button">Start</button>
      <button class="btn btn-ghost" id="lapBtn" type="button" hidden>Lap</button>
      <button class="btn btn-ghost btn-icon-text" id="addMinuteBtn" type="button" hidden>+1:00</button>
    </div>

    <p class="kbd-hint" id="kbdHint" aria-hidden="true">
      <span><kbd>Space</kbd> start/pause</span>
      <span><kbd>R</kbd> reset</span>
      <span><kbd>1–5</kbd> switch</span>
    </p>

  </main>

  <!-- ===== Mode panels: mode-specific content below the stage ===== -->

  <!-- Clock options -->
  <section class="panel" id="panel-clock" data-panel="clock">
    <label class="toggle">
      <input type="checkbox" id="clock24h">
      <span>24-hour time</span>
    </label>
  </section>

  <!-- Countdown presets & entry -->
  <section class="panel" id="panel-countdown" data-panel="countdown" hidden>
    <div class="chips" id="countdownChips"></div>
    <div class="time-entry" id="countdownEntry">
      <div class="entry-field">
        <input type="number" id="cdHours" min="0" max="23" value="0" inputmode="numeric" aria-label="Hours">
        <label>hr</label>
      </div>
      <div class="entry-field">
        <input type="number" id="cdMinutes" min="0" max="59" value="5" inputmode="numeric" aria-label="Minutes">
        <label>min</label>
      </div>
      <div class="entry-field">
        <input type="number" id="cdSeconds" min="0" max="59" value="0" inputmode="numeric" aria-label="Seconds">
        <label>sec</label>
      </div>
      <button class="btn btn-text" id="savePresetBtn" type="button">Save as preset</button>
    </div>
  </section>

  <!-- Stopwatch laps -->
  <section class="panel" id="panel-stopwatch" data-panel="stopwatch" hidden>
    <ol class="laps" id="lapsList"></ol>
  </section>

  <!-- Pomodoro settings -->
  <section class="panel" id="panel-pomodoro" data-panel="pomodoro" hidden>
    <div class="time-entry">
      <div class="entry-field">
        <input type="number" id="pomoFocus" min="1" max="120" value="25" inputmode="numeric" aria-label="Focus minutes">
        <label>focus</label>
      </div>
      <div class="entry-field">
        <input type="number" id="pomoShort" min="1" max="60" value="5" inputmode="numeric" aria-label="Short break minutes">
        <label>short</label>
      </div>
      <div class="entry-field">
        <input type="number" id="pomoLong" min="1" max="60" value="15" inputmode="numeric" aria-label="Long break minutes">
        <label>long</label>
      </div>
      <div class="entry-field">
        <input type="number" id="pomoRounds" min="1" max="12" value="4" inputmode="numeric" aria-label="Rounds before long break">
        <label>rounds</label>
      </div>
    </div>
  </section>

  <!-- Alarms -->
  <section class="panel" id="panel-alarms" data-panel="alarms" hidden>
    <div class="alarm-entry">
      <input type="time" id="alarmTime" aria-label="Alarm time">
      <input type="text" id="alarmLabel" placeholder="Label (optional)" maxlength="40">
      <button class="btn btn-primary btn-compact" id="addAlarmBtn" type="button">Add</button>
    </div>
    <div class="alarm-days" id="alarmDays">
      <button class="day-chip" data-day="0" type="button">S</button>
      <button class="day-chip" data-day="1" type="button">M</button>
      <button class="day-chip" data-day="2" type="button">T</button>
      <button class="day-chip" data-day="3" type="button">W</button>
      <button class="day-chip" data-day="4" type="button">T</button>
      <button class="day-chip" data-day="5" type="button">F</button>
      <button class="day-chip" data-day="6" type="button">S</button>
    </div>
    <p class="hint">Repeats only on selected days. Leave none selected for a one-time alarm.</p>
    <ol class="alarms-list" id="alarmsList"></ol>
    <p class="hint hint-quiet">Alarms sound while Timekeeper is open in a browser tab or installed window. Keep it running for it to ring.</p>
  </section>

</div>

<!-- Full-screen alarm-ringing takeover: replaces the old beep-and-toast with
     something you can actually act on — stop it, or push it back 5 minutes. -->
<div class="ring-overlay" id="alarmRingOverlay" hidden role="alertdialog" aria-modal="true" aria-labelledby="alarmRingLabel">
  <div class="ring-overlay-card">
    <div class="ring-overlay-icon" aria-hidden="true">⏰</div>
    <div class="ring-overlay-time" id="alarmRingTime">00:00</div>
    <div class="ring-overlay-label" id="alarmRingLabel">Alarm</div>
    <div class="ring-overlay-actions">
      <button class="btn btn-ghost btn-lg" id="alarmSnoozeBtn" type="button">Snooze 5m</button>
      <button class="btn btn-primary btn-lg" id="alarmStopBtn" type="button">Stop</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
